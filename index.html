<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trastero V1.1 Crystal - Baldas</title>
    <style>
        :root {
            --bg-main: #030712;
            --card-bg: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            --card-border: rgba(56, 189, 248, 0.2);
            --cyan-neon: #38bdf8;
            --pink-neon: #ec4899;
            --yellow-neon: #facc15;
            --purple-neon: #a855f7;
            --green-neon: #22c55e;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            margin: 0;
            padding: 16px 16px 90px 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Top Header Style */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .greeting {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .status-badge {
            font-size: 0.75rem;
            color: var(--cyan-neon);
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            margin-top: 10px;
        }
        .version {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Card Crystal Styles */
        .card-crystal {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--cyan-neon);
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .main-stat {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            color: var(--text-white);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Dual Stat Card */
        .dual-stat {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .stat-col {
            text-align: center;
            flex: 1;
        }
        .stat-col:first-child {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-val-cyan {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--cyan-neon);
        }
        .stat-val-pink {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--pink-neon);
        }

        /* Tarjetas de Baldas / Zonas Específicas */
        .shelf-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
        }
        .shelf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .shelf-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shelf-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--cyan-neon);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .shelf-items-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 0;
        }
        .shelf-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .item-type-tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .tag-caja { background: rgba(168, 85, 247, 0.2); color: var(--purple-neon); }
        .tag-suelto { background: rgba(250, 204, 21, 0.2); color: var(--yellow-neon); }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(3, 7, 18, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-item.active {
            color: var(--cyan-neon);
        }
        .nav-icon {
            font-size: 1.3rem;
            margin-bottom: 3px;
        }

        /* Modal dark */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 200;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            color: white;
        }
        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            color: white;
            margin-top: 4px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, var(--cyan-neon), #2563eb);
            border: none;
            color: white;
            font-weight: 800;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }
        .section-title {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 800;
            margin: 24px 0 12px 0;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Top Header -->
    <div class="header-top">
        <div>
            <h1 class="greeting">¡Buenas tardes! 📦</h1>
            <div class="status-badge">ESTADO: TRASTERO ORGANIZADO</div>
            <div class="brand">MI TRASTERO</div>
            <div class="version">V1.1 CRYSTAL</div>
        </div>
        <div style="font-size: 1.5rem; cursor: pointer;" onclick="openModal()">➕</div>
    </div>

    <!-- Main Stat Card -->
    <div class="card-crystal">
        <div class="card-title">TOTAL ELEMENTOS GUARDADOS</div>
        <div class="main-stat" id="totalCount">0 OBJETOS</div>
    </div>

    <!-- Dual Stat Card -->
    <div class="card-crystal dual-stat">
        <div class="stat-col">
            <div class="card-title">CAJAS / BOLSAS</div>
            <div class="stat-val-cyan" id="boxesCount">0 📦</div>
        </div>
        <div class="stat-col">
            <div class="card-title">OBJETOS SUELTOS</div>
            <div class="stat-val-pink" id="sueltosCount">0 🏷️</div>
        </div>
    </div>

    <!-- Sección de Tarjetas Detalladas por Balda / Zona -->
    <div class="section-title">
        <span>DESGLOSE POR BALDAS Y ZONAS</span>
        <span style="color:var(--cyan-neon); font-size:0.7rem;">7 ZONAS</span>
    </div>

    <div id="shelvesContainer">
        <!-- Las 7 tarjetas se ordenan ahora desde Balda 1 (Inferior) hacia arriba -->
    </div>

</div>

<!-- Bottom Navbar -->
<div class="navbar">
    <div class="nav-item active" onclick="scrollToTop()">
        <div class="nav-icon">🏠</div>
        <span>INICIO</span>
    </div>
    <div class="nav-item" onclick="scrollToShelves()">
        <div class="nav-icon">🪜</div>
        <span>BALDAS</span>
    </div>
    <div class="nav-item" onclick="openModal()">
        <div class="nav-icon">➕</div>
        <span>AÑADIR</span>
    </div>
    <div class="nav-item" onclick="exportBackup()">
        <div class="nav-icon">💾</div>
        <span>COPIA</span>
    </div>
</div>

<!-- Modal Añadir -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--cyan-neon);">Añadir al Trastero</h3>
        
        <label style="font-size:0.8rem;">Tipo de elemento:</label>
        <select id="inputType" class="form-control">
            <option value="Caja / Bolsa">📦 Caja / Bolsa</option>
            <option value="Objeto Suelto">🏷️ Objeto Suelto</option>
        </select>

        <label style="font-size:0.8rem;">Ubicación exacta:</label>
        <select id="inputLoc" class="form-control">
            <option value="Balda 1 (Inferior)">Balda 1 (Inferior)</option>
            <option value="Balda 2">Balda 2</option>
            <option value="Balda 3">Balda 3</option>
            <option value="Balda 4">Balda 4</option>
            <option value="Balda 5 (Superior)">Balda 5 (Superior)</option>
            <option value="Bolsas Colgadas">Bolsas Colgadas</option>
            <option value="Suelo / Hueco">Suelo / Hueco</option>
        </select>

        <label style="font-size:0.8rem;">Nombre del elemento:</label>
        <input type="text" id="inputName" class="form-control" placeholder="Ej. Caja Herramientas o Casco Coche">

        <label style="font-size:0.8rem;">Contenido / Detalle:</label>
        <input type="text" id="inputItems" class="form-control" placeholder="Ej. Taladro, brocas, tornillos...">

        <button class="btn-action" onclick="saveItem()">GUARDAR EN TRASTERO</button>
        <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:10px; cursor:pointer;" onclick="closeModal()">Cancelar</button>
    </div>
</div>

<script>
    // Zonas ordenadas desde abajo (Balda 1) hacia arriba (Balda 5)
    const zones = [
        "Balda 1 (Inferior)",
        "Balda 2",
        "Balda 3",
        "Balda 4",
        "Balda 5 (Superior)",
        "Bolsas Colgadas",
        "Suelo / Hueco"
    ];

    let inventory = JSON.parse(localStorage.getItem('trastero_crystal_v1')) || [
        { type: "Caja / Bolsa", name: "Caja Herramientas", loc: "Balda 3", items: "Taladro, brocas, martillo" },
        { type: "Objeto Suelto", name: "Aspirador de mano", loc: "Balda 2", items: "Cargador y boquillas" },
        { type: "Caja / Bolsa", name: "Bolsa Ropa Nieve", loc: "Bolsas Colgadas", items: "Chaquetón y guantes" },
        { type: "Objeto Suelto", name: "Bote Pintura Blanca", loc: "Suelo / Hueco", items: "Pintura plástica 5L" }
    ];

    function render() {
        document.getElementById('totalCount').innerText = `${inventory.length} OBJETOS`;
        
        const boxesCount = inventory.filter(i => i.type === 'Caja / Bolsa').length;
        const sueltosCount = inventory.filter(i => i.type === 'Objeto Suelto').length;
        
        document.getElementById('boxesCount').innerText = `${boxesCount} 📦`;
        document.getElementById('sueltosCount').innerText = `${sueltosCount} 🏷️`;

        const container = document.getElementById('shelvesContainer');
        container.innerHTML = '';

        zones.forEach(zone => {
            const zoneItems = inventory.filter(item => item.loc === zone);
            
            const shelfCard = document.createElement('div');
            shelfCard.className = 'shelf-card';
            
            let itemsHtml = '';
            if (zoneItems.length === 0) {
                itemsHtml = `<div style="font-size:0.8rem; color:var(--text-muted); padding:6px 0;">Vacía (sin objetos registrados)</div>`;
            } else {
                zoneItems.forEach((item, index) => {
                    const isCaja = item.type === 'Caja / Bolsa';
                    itemsHtml += `
                        <div class="shelf-item-row">
                            <div>
                                <strong style="color:var(--text-white);">${item.name}</strong>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${item.items || 'Sin detalle'}</div>
                            </div>
                            <span class="item-type-tag ${isCaja ? 'tag-caja' : 'tag-suelto'}">
                                ${isCaja ? '📦 Caja' : '🏷️ Suelto'}
                            </span>
                        </div>
                    `;
                });
            }

            shelfCard.innerHTML = `
                <div class="shelf-header">
                    <div class="shelf-title">
                        <span>🪜</span> ${zone}
                    </div>
                    <span class="shelf-badge">${zoneItems.length} Elementos</span>
                </div>
                <div class="shelf-items-list">
                    ${itemsHtml}
                </div>
            `;
            container.appendChild(shelfCard);
        });
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveItem() {
        const type = document.getElementById('inputType').value;
        const loc = document.getElementById('inputLoc').value;
        const name = document.getElementById('inputName').value.trim();
        const items = document.getElementById('inputItems').value.trim();

        if(name) {
            inventory.unshift({ type, name, loc, items });
            localStorage.setItem('trastero_crystal_v1', JSON.stringify(inventory));
            render();
            closeModal();
            document.getElementById('inputName').value = '';
            document.getElementById('inputItems').value = '';
        }
    }

    function scrollToShelves() {
        document.getElementById('shelvesContainer').scrollIntoView({ behavior: 'smooth' });
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exportBackup() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(inventory));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", "trastero_backup_crystal.json");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
    }

    render();
</script>

</body>
</html>
